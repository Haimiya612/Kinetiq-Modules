name: Kinetiq Unified Module Catalogue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/local-modules.json'
      - 'catalog/upstreams.json'
      - 'catalog/update-policy.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/unified-catalog.yml'
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: write
concurrency:
  group: kinetiq-unified-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run sync
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: Kinetiq-Unified-Catalogue
          path: |
            repository.json
            catalog/unified.json
            catalog/diagnostics.json
            catalog/snapshots/
          if-no-files-found: error
          retention-days: 30
      - name: Publish validated catalogue metadata (not executable code)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repository.json catalog/unified.json catalog/diagnostics.json catalog/snapshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(catalog): publish upstream metadata refresh'
          git push origin HEAD:main
